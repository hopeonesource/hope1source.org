[build]
  command = "node scripts/build-v4.mjs && node scripts/check-v4-prerender.mjs"
  publish = "dist/v4"

[build.environment]
  NODE_VERSION = "22"
  VITE_V4_BASE = "/"
  VITE_SITE_ORIGIN = "https://hope1source.org"
  VITE_SITE_INDEXABLE = "false"

[context.production.environment]
  VITE_SITE_INDEXABLE = "true"
  VITE_ASSET_ORIGIN = "https://hope1source-org.netlify.app"
